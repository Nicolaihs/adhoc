        function getRandomNumberFromArray(arr) {
            const randomIndex = Math.floor(Math.random() * arr.length);
            return arr[randomIndex];
        }

        let intervalId = null;
        const audio = document.getElementById('audio');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        function getRandomAudioUrl() {
            let randomInt = getRandomNumberFromArray(filliste);
            let randomString = randomInt.toString();
            let firstFiveDigits = randomString.substring(0, 5);
            return `https://static.ordnet.dk/mp3/${firstFiveDigits}/${randomString}_1.mp3`;
        }

        function playRandomAudio() {
            const url = getRandomAudioUrl();
            audio.src = url;
            audio.play();
            // Media Session API for lock screen controls
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new window.MediaMetadata({
                    title: "DDO Sovehjælp",
                    artist: "Den Danske Ordbog",
                    album: "Sovehjælp",
                    artwork: [
                        { src: "https://www.dsl.dk/sites/all/themes/dsl/logo.png", sizes: "192x192", type: "image/png" }
                    ]
                });
                navigator.mediaSession.setActionHandler('play', () => { audio.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); });
                navigator.mediaSession.setActionHandler('stop', () => { audio.pause(); audio.currentTime = 0; });
            }
        }

        startBtn.onclick = () => {
            if (intervalId) clearInterval(intervalId);
            playRandomAudio();
            intervalId = setInterval(playRandomAudio, 5000);
        };

        stopBtn.onclick = () => {
            if (intervalId) clearInterval(intervalId);
            audio.pause();
        };

        // Optional: auto-play next when current ends
        audio.onended = () => {
            if (intervalId) playRandomAudio();
        };
    </script>
